apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cracha.name" . }}-agent
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cracha.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
---
# The agent's uses of the API (design 7.8): the enrolled pods of its node,
# listed and watched to rebuild and keep its listeners (the agent filters to
# its node; the API cannot restrict the grant to it), the pod an enrolment
# names, got to check its label, and in init mode the TokenReview of the
# init container's bound token. No Secrets, no writes.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "cracha.name" . }}-agent
  labels:
    {{- include "cracha.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  {{- if eq (include "cracha.agentEnrol" .) "init" }}
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "cracha.name" . }}-agent
  labels:
    {{- include "cracha.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "cracha.name" . }}-agent
subjects:
  - kind: ServiceAccount
    name: {{ include "cracha.name" . }}-agent
    namespace: {{ .Release.Namespace }}
