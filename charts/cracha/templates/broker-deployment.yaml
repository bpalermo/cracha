{{- $selector := dict "root" . "component" "broker" -}}
{{- $labels := list -}}
{{- range $domain, $label := .Values.broker.trustDomainLabels -}}
{{- $labels = append $labels (printf "%s=%s" $domain $label) -}}
{{- end -}}
{{- $bundleKey := include "cracha.bundleKey" . -}}
{{- $bundleDir := include "cracha.bundleDir" . -}}
{{- $backend := include "cracha.authzBackend" . -}}
{{- $spicedb := .Values.broker.authz.spicedb -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cracha.name" . }}-broker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cracha.labels" . | nindent 4 }}
    app.kubernetes.io/component: broker
spec:
  replicas: {{ .Values.broker.replicas }}
  selector:
    matchLabels:
      {{- include "cracha.selectorLabels" $selector | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cracha.labels" . | nindent 8 }}
        app.kubernetes.io/component: broker
      annotations:
        # A new document restarts the pods: the broker reads its files once.
        checksum/config: {{ include (print .Template.BasePath "/broker-config.yaml") . | sha256sum }}
        {{- with .Values.broker.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.broker.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      serviceAccountName: {{ include "cracha.name" . }}-broker
      # The broker has no use for the Kubernetes API.
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.broker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.broker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: broker
          image: {{ include "cracha.image" (dict "root" . "image" .Values.broker.image) }}
          imagePullPolicy: {{ .Values.broker.image.pullPolicy }}
          args:
            - --listen=:{{ .Values.broker.port }}
            {{- include "cracha.tlsArgs" $selector | nindent 12 }}
            - --workload-api-socket=unix:///spiffe-workload-api/{{ .Values.broker.workloadAPI.socket }}
            - --cluster={{ required "broker.cluster is required: the name of the cluster this broker serves" .Values.broker.cluster }}
            {{- if $labels }}
            - --trust-domain-labels={{ join "," $labels }}
            {{- end }}
            - --authz-backend={{ $backend }}
            {{- if eq $backend "static" }}
            - --assignments=/etc/cracha/assignments/{{ .Values.broker.assignments.key }}
            {{- else }}
            - --spicedb-endpoint={{ $spicedb.endpoint }}
            - --spicedb-token-file=/etc/cracha/spicedb/token/{{ $spicedb.tokenSecret.key }}
            {{- if $spicedb.ca }}
            - --spicedb-ca=/etc/cracha/spicedb/ca/ca.pem
            {{- end }}
            {{- if $spicedb.insecure }}
            - --spicedb-insecure
            {{- end }}
            - --spicedb-timeout={{ $spicedb.timeout }}
            {{- end }}
            {{- if .Values.broker.bundle.source }}
            - --bundle-source={{ .Values.broker.bundle.source }}
            {{- if eq $bundleKey "kms" }}
            - --bundle-kms-key={{ .Values.broker.bundle.kmsKey }}
            {{- else }}
            - --bundle-verify-key=/etc/cracha/bundle-key/public.pem
            {{- end }}
            - --bundle-poll-interval={{ .Values.broker.bundle.pollInterval }}
            {{- else }}
            - --grants-fixture=/etc/cracha/grants/{{ .Values.broker.grants.key }}
            {{- end }}
            {{- with .Values.broker.awsRegion }}
            - --aws-region={{ . }}
            {{- end }}
            - --log-level={{ include "cracha.logLevel" .Values.broker.logLevel }}
            - --cache={{ .Values.broker.cache.enabled }}
            - --cache-min-remaining={{ .Values.broker.cache.minRemaining }}
            - --cache-refresh-at={{ .Values.broker.cache.refreshAt }}
            - --cache-max-entries={{ .Values.broker.cache.maxEntries }}
            - --cache-stale-check-max={{ .Values.broker.cache.staleCheckMax }}
          {{- with .Values.broker.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.broker.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: https
              containerPort: {{ .Values.broker.port }}
          # Ready once the grant bundle has verified (/readyz); alive while
          # the process serves (/healthz).
          readinessProbe:
            httpGet:
              path: /readyz
              port: https
              scheme: HTTPS
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
            periodSeconds: 10
          securityContext:
            {{- include "cracha.restrictedSecurityContext" . | nindent 12 }}
          {{- with .Values.broker.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- include "cracha.tlsVolumeMount" $selector | nindent 12 }}
            {{- if eq $backend "static" }}
            - name: assignments
              mountPath: /etc/cracha/assignments
              readOnly: true
            {{- else }}
            - name: spicedb-token
              mountPath: /etc/cracha/spicedb/token
              readOnly: true
            {{- if $spicedb.ca }}
            - name: spicedb-ca
              mountPath: /etc/cracha/spicedb/ca
              readOnly: true
            {{- end }}
            {{- end }}
            {{- if $bundleDir }}
            - name: bundle
              mountPath: {{ $bundleDir }}
              readOnly: true
            {{- end }}
            {{- if has $bundleKey (list "inline" "secret") }}
            - name: bundle-key
              mountPath: /etc/cracha/bundle-key
              readOnly: true
            {{- end }}
            {{- if not .Values.broker.bundle.source }}
            - name: grants
              mountPath: /etc/cracha/grants
              readOnly: true
            {{- end }}
            - name: spire-workload-api
              mountPath: /spiffe-workload-api
              readOnly: true
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      # Replicas should not share a fate.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "cracha.selectorLabels" $selector | nindent 14 }}
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "cracha.selectorLabels" $selector | nindent 14 }}
      volumes:
        {{- include "cracha.tlsVolume" $selector | nindent 8 }}
        {{- if eq $backend "static" }}
        - name: assignments
          configMap:
            name: {{ .Values.broker.assignments.existingConfigMap | default (printf "%s-assignments" (include "cracha.name" .)) }}
        {{- else }}
        # SpiceDB's preshared key, from the Secret the install keeps, read
        # by the broker as a file.
        - name: spicedb-token
          secret:
            secretName: {{ $spicedb.tokenSecret.name }}
        {{- if $spicedb.ca }}
        - name: spicedb-ca
          configMap:
            name: {{ include "cracha.name" . }}-spicedb-ca
        {{- end }}
        {{- end }}
        {{- if $bundleDir }}
        # The published bundle, laid out as grantc publish writes it.
        - name: bundle
          {{- toYaml .Values.broker.bundle.volume | nindent 10 }}
        {{- end }}
        {{- if has $bundleKey (list "inline" "secret") }}
        - name: bundle-key
          secret:
            secretName: {{ .Values.broker.bundle.existingSecret | default (printf "%s-bundle-key" (include "cracha.name" .)) }}
        {{- end }}
        {{- if not .Values.broker.bundle.source }}
        - name: grants
          configMap:
            name: {{ .Values.broker.grants.existingConfigMap | default (printf "%s-grants" (include "cracha.name" .)) }}
        {{- end }}
        # The trust bundle the JWT-SVIDs are verified against comes from the
        # broker's own Workload API connection (design 6.5).
        - name: spire-workload-api
          {{- toYaml .Values.broker.workloadAPI.volume | nindent 10 }}
---
# The broker's service account exists for the platform identity (design 5):
# an IAM role annotation, or an EKS Pod Identity association. It holds no
# Kubernetes permissions.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cracha.name" . }}-broker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cracha.labels" . | nindent 4 }}
    app.kubernetes.io/component: broker
  {{- with .Values.broker.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
