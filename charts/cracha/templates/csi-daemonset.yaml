{{- $selector := dict "root" . "component" "csi" -}}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "cracha.name" . }}-csi
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cracha.labels" . | nindent 4 }}
    app.kubernetes.io/component: csi
spec:
  selector:
    matchLabels:
      {{- include "cracha.selectorLabels" $selector | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cracha.labels" . | nindent 8 }}
        app.kubernetes.io/component: csi
      {{- with .Values.csi.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.csi.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      serviceAccountName: {{ include "cracha.name" . }}-csi
      # Design 7.7: no host networking, no host PID namespace, no
      # capabilities. Its host access is the kubelet plugin directories and
      # the identity issuer's sockets.
      hostNetwork: false
      hostPID: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.csi.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.csi.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: csi
          image: {{ include "cracha.image" (dict "root" . "image" .Values.csi.image) }}
          imagePullPolicy: {{ .Values.csi.image.pullPolicy }}
          args:
            - --endpoint=unix:///csi/csi.sock
            - --issuer-broker-socket=/run/spire/broker/{{ .Values.csi.brokerAPI.socket }}
            - --workload-api=unix:///spiffe-workload-api/{{ .Values.csi.workloadAPI.socket }}
            - --max-token-ttl={{ .Values.csi.maxTokenTTL }}
            - --publish-deadline={{ .Values.csi.publishDeadline }}
            - --token-uid={{ int .Values.csi.tokenUid }}
            - --token-gid={{ int .Values.csi.tokenGid }}
            - --healthz=:{{ .Values.csi.healthzPort }}
            - --log-level={{ include "cracha.logLevel" .Values.csi.logLevel }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: healthz
              containerPort: {{ .Values.csi.healthzPort }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: healthz
            periodSeconds: 10
          securityContext:
            # Root, because it writes into kubelet's pod directories.
            # Nothing more: no capabilities, no writable image.
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          {{- with .Values.csi.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: plugin-dir
              mountPath: /csi
            # The target paths kubelet hands the plugin are under here, and
            # must be the same path inside the container as on the host.
            - name: pods-dir
              mountPath: {{ .Values.csi.kubeletDir }}/pods
            - name: spire-workload-api
              mountPath: /spiffe-workload-api
              readOnly: true
            - name: spire-broker-api
              mountPath: /run/spire/broker
              readOnly: true
        # Registers the plugin's socket with kubelet.
        - name: node-driver-registrar
          image: {{ include "cracha.image" (dict "root" . "image" .Values.csi.registrar.image) }}
          imagePullPolicy: {{ .Values.csi.registrar.image.pullPolicy }}
          args:
            - --csi-address=/csi/csi.sock
            - --kubelet-registration-path={{ .Values.csi.kubeletDir }}/plugins/csi.cracha.dev/csi.sock
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          {{- with .Values.csi.registrar.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: plugin-dir
              mountPath: /csi
            - name: registration-dir
              mountPath: /registration
      volumes:
        - name: plugin-dir
          hostPath:
            path: {{ .Values.csi.kubeletDir }}/plugins/csi.cracha.dev
            type: DirectoryOrCreate
        - name: registration-dir
          hostPath:
            path: {{ .Values.csi.kubeletDir }}/plugins_registry
            type: Directory
        - name: pods-dir
          hostPath:
            path: {{ .Values.csi.kubeletDir }}/pods
            type: Directory
        # The identity issuer's sockets: the Workload API for the plugin's
        # own identity, the Broker API for the pods' tokens.
        - name: spire-workload-api
          hostPath:
            path: {{ .Values.csi.workloadAPI.hostPath }}
            type: Directory
        - name: spire-broker-api
          hostPath:
            path: {{ .Values.csi.brokerAPI.hostPath }}
            type: Directory
