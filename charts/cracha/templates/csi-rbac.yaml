apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cracha.name" . }}-csi
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cracha.labels" . | nindent 4 }}
    app.kubernetes.io/component: csi
---
# The plugin's only use of the API: checking the bound service account token
# kubelet hands it against the pod it was given (design 7.3, step 2).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "cracha.name" . }}-csi
  labels:
    {{- include "cracha.labels" . | nindent 4 }}
    app.kubernetes.io/component: csi
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "cracha.name" . }}-csi
  labels:
    {{- include "cracha.labels" . | nindent 4 }}
    app.kubernetes.io/component: csi
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "cracha.name" . }}-csi
subjects:
  - kind: ServiceAccount
    name: {{ include "cracha.name" . }}-csi
    namespace: {{ .Release.Namespace }}
