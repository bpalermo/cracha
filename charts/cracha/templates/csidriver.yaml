# docs/design.md, section 7.1, verbatim.
apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  # The name pods use in their volumes and the webhook injects; fixed, not
  # derived from the release.
  name: csi.cracha.dev
  labels:
    {{- include "cracha.labels" . | nindent 4 }}
spec:
  # Inline volumes only: nothing to attach, nothing to provision.
  attachRequired: false
  # The plugin needs the pod's identity to fetch its token.
  podInfoOnMount: true
  volumeLifecycleModes: [Ephemeral]
  # Kubelet publishes the volume again periodically, which is when the token
  # is rotated.
  requiresRepublish: true
  # The pod's fsGroup reaches the plugin as the volume mount group, and the
  # token is written with that group, so a pod running as any user reads it.
  # (The plugin advertises VOLUME_MOUNT_GROUP, so kubelet delegates the
  # ownership to it rather than walking the volume itself.)
  fsGroupPolicy: File
  # And proof of the pod: a token for its service account that only the
  # plugin accepts, checked against the pod it was given.
  tokenRequests:
    - audience: cracha-csi
      expirationSeconds: 600
