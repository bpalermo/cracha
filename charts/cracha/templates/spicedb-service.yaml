{{- if include "cracha.spicedbEnabled" . }}
{{- $selector := dict "root" . "component" "spicedb" -}}
{{- $s := .Values.spicedb -}}
# SpiceDB's gateway: the address every client of SpiceDB dials
# (broker.authz.spicedb.endpoint by default), SPIFFE mTLS only.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cracha.name" . }}-spicedb
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cracha.labels" . | nindent 4 }}
    app.kubernetes.io/component: spicedb
spec:
  selector:
    {{- include "cracha.selectorLabels" $selector | nindent 4 }}
  ports:
    - name: grpc
      port: {{ $s.gateway.port }}
      targetPort: grpc
      appProtocol: grpc
{{- if gt (int $s.replicas) 1 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "cracha.name" . }}-spicedb
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cracha.labels" . | nindent 4 }}
    app.kubernetes.io/component: spicedb
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "cracha.selectorLabels" $selector | nindent 6 }}
{{- end }}
{{- if $s.networkPolicy.enabled }}
---
# Only the gateway's ports, from spicedb.networkPolicy.from (anywhere when
# empty). SpiceDB itself listens on the pod's loopback, which no policy
# governs and nothing outside the pod reaches.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cracha.name" . }}-spicedb
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cracha.labels" . | nindent 4 }}
    app.kubernetes.io/component: spicedb
spec:
  podSelector:
    matchLabels:
      {{- include "cracha.selectorLabels" $selector | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: grpc
          protocol: TCP
      {{- with $s.networkPolicy.from }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    # The kubelet's probes.
    - ports:
        - port: health
          protocol: TCP
{{- end }}
{{- end }}
