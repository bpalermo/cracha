{{- if not (has .Values.tls.mode (list "generated" "existing" "cert-manager")) }}
{{- fail (printf "tls.mode must be generated, existing or cert-manager, not %q" .Values.tls.mode) }}
{{- end }}
{{- $root := . -}}
{{- /*
The webhook is the only component with a certificate from the chart: the
broker serves SPIFFE mTLS with its own X.509-SVID (design 6.5).
*/ -}}
{{- $components := list "webhook" -}}
{{- if eq .Values.tls.mode "generated" }}
{{- /*
A private authority and the webhook's certificate. Whatever is already in the
cluster is kept: lookup finds the Secrets of an earlier install, so an
upgrade does not replace a certificate that running pods are using, until it
comes within tls.generated.renewBeforeDays of expiring: then the upgrade
issues a new one, and the webhook picks it up on its next restart. Deleting a
Secret also makes the next upgrade issue a new one. The authority itself is
never renewed here. The webhook configuration is rendered below, from the
same authority, so the two cannot disagree.
*/ -}}
{{- $now := now | unixEpoch -}}
{{- $validity := mul (int .Values.tls.generated.validityDays) 86400 -}}
{{- $renewBefore := mul (int .Values.tls.generated.renewBeforeDays) 86400 -}}
{{- $caName := printf "%s-ca" (include "cracha.name" .) -}}
{{- $caSecret := lookup "v1" "Secret" .Release.Namespace $caName -}}
{{- $ca := "" -}}
{{- if and $caSecret (index $caSecret.data "tls.crt") }}
{{- $ca = buildCustomCert (index $caSecret.data "tls.crt") (index $caSecret.data "tls.key") -}}
{{- else }}
{{- $ca = genCA (printf "%s certificate authority" (include "cracha.name" .)) 3650 -}}
{{- end }}
# The authority that signed the webhook's certificate.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $caName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cracha.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  tls.crt: {{ $ca.Cert | b64enc }}
  tls.key: {{ $ca.Key | b64enc }}
{{- range $component := $components }}
{{- $args := dict "root" $root "component" $component }}
{{- $name := include "cracha.tlsSecret" $args }}
{{- $identity := include "cracha.serviceHost" $args }}
{{- $existing := lookup "v1" "Secret" $root.Release.Namespace $name }}
{{- /*
Keep the certificate that is there if it was issued by the authority that is
there, for the identity wanted, and is not close to expiring. When it was
issued is not in the certificate in a form a template can read, so the expiry
is recorded on the Secret.
*/ -}}
{{- $keep := false }}
{{- $notAfter := add $now $validity }}
{{- if and $existing (index $existing.data "tls.crt") $caSecret (index $caSecret.data "tls.crt") }}
{{- $annotations := $existing.metadata.annotations | default dict }}
{{- $recorded := index $annotations "cracha.dev/tls-not-after" }}
{{- if and $recorded (eq (index $annotations "cracha.dev/tls-identity") $identity) }}
{{- if gt (sub (int64 $recorded) $now) (int64 $renewBefore) }}
{{- $keep = true }}
{{- $notAfter = int64 $recorded }}
{{- end }}
{{- end }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "cracha.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
  annotations:
    # When the certificate expires, in seconds since 1970, and for whom it
    # was issued: what the next upgrade decides renewal on.
    cracha.dev/tls-not-after: {{ $notAfter | quote }}
    cracha.dev/tls-identity: {{ $identity | quote }}
type: kubernetes.io/tls
data:
  {{- if $keep }}
  tls.crt: {{ index $existing.data "tls.crt" }}
  tls.key: {{ index $existing.data "tls.key" }}
  {{- else }}
  {{- $cert := genSignedCert $identity nil (list $identity (printf "%s.cluster.local" $identity)) (int $root.Values.tls.generated.validityDays) $ca }}
  tls.crt: {{ $cert.Cert | b64enc }}
  tls.key: {{ $cert.Key | b64enc }}
  {{- end }}
  ca.crt: {{ $ca.Cert | b64enc }}
{{- end }}
---
{{ include "cracha.webhookConfiguration" (dict "root" . "caBundle" ($ca.Cert | b64enc) "annotations" dict) }}
{{- else if eq .Values.tls.mode "cert-manager" }}
{{- $issuer := .Values.tls.certManager.issuerRef }}
{{- if not $issuer.name }}
{{- fail "tls.certManager.issuerRef.name is required with tls.mode cert-manager" }}
{{- end }}
{{- range $component := $components }}
{{- $args := dict "root" $root "component" $component }}
{{- $identity := include "cracha.serviceHost" $args }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "cracha.name" $root }}-{{ $component }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "cracha.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  secretName: {{ include "cracha.tlsSecret" $args }}
  commonName: {{ $identity }}
  dnsNames:
    - {{ $identity }}
    - {{ $identity }}.cluster.local
  duration: {{ $root.Values.tls.certManager.duration }}
  renewBefore: {{ $root.Values.tls.certManager.renewBefore }}
  issuerRef:
    name: {{ $issuer.name }}
    kind: {{ $issuer.kind }}
    group: {{ $issuer.group }}
{{- end }}
{{- end }}
