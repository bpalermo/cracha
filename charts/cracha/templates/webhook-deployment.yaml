{{- $selector := dict "root" . "component" "webhook" -}}
{{- if not (has .Values.webhook.conflictingEnv (list "reject" "strip")) }}
{{- fail (printf "webhook.conflictingEnv must be reject or strip, not %q" .Values.webhook.conflictingEnv) }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cracha.name" . }}-webhook
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cracha.labels" . | nindent 4 }}
    app.kubernetes.io/component: webhook
spec:
  replicas: {{ .Values.webhook.replicas }}
  selector:
    matchLabels:
      {{- include "cracha.selectorLabels" $selector | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cracha.labels" . | nindent 8 }}
        app.kubernetes.io/component: webhook
      {{- with .Values.webhook.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.webhook.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      serviceAccountName: {{ include "cracha.name" . }}-webhook
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.webhook.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.webhook.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: webhook
          image: {{ include "cracha.image" (dict "root" . "image" .Values.webhook.image) }}
          imagePullPolicy: {{ .Values.webhook.image.pullPolicy }}
          args:
            - --listen=:{{ .Values.webhook.port }}
            {{- include "cracha.tlsArgs" $selector | nindent 12 }}
            - --broker-url={{ include "cracha.brokerUrl" . }}
            - --default-region={{ required "webhook.defaultRegion is required: AWS_REGION for the pods that do not set their own" .Values.webhook.defaultRegion }}
            - --conflicting-env={{ .Values.webhook.conflictingEnv }}
            - --sa-cache-ttl={{ .Values.webhook.saCacheTTL }}
            - --log-level={{ include "cracha.logLevel" .Values.webhook.logLevel }}
          ports:
            - name: https
              containerPort: {{ .Values.webhook.port }}
          # Ready once the apiserver answers: without it no ServiceAccount
          # can be looked up and every opted-in pod would be denied.
          readinessProbe:
            httpGet:
              path: /readyz
              port: https
              scheme: HTTPS
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
            periodSeconds: 10
          securityContext:
            {{- include "cracha.restrictedSecurityContext" . | nindent 12 }}
          {{- with .Values.webhook.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- include "cracha.tlsVolumeMount" $selector | nindent 12 }}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "cracha.selectorLabels" $selector | nindent 14 }}
      volumes:
        {{- include "cracha.tlsVolume" $selector | nindent 8 }}
