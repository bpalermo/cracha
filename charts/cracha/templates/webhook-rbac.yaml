apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cracha.name" . }}-webhook
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cracha.labels" . | nindent 4 }}
    app.kubernetes.io/component: webhook
---
# The webhook looks a pod's ServiceAccount up for the opt-in annotation
# (design 7.5), in any namespace; watches the Namespaces for the
# per-namespace region override (the cracha.dev/region annotation); and
# keeps the caBundle of its own webhook configuration, and no other, at its
# trust bundle. That is all it may do with the API.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "cracha.name" . }}-webhook
  labels:
    {{- include "cracha.labels" . | nindent 4 }}
    app.kubernetes.io/component: webhook
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["mutatingwebhookconfigurations"]
    resourceNames: [{{ include "cracha.name" . }}-webhook]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "cracha.name" . }}-webhook
  labels:
    {{- include "cracha.labels" . | nindent 4 }}
    app.kubernetes.io/component: webhook
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "cracha.name" . }}-webhook
subjects:
  - kind: ServiceAccount
    name: {{ include "cracha.name" . }}-webhook
    namespace: {{ .Release.Namespace }}
