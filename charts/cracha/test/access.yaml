# cracha-access with its defaults, on top of the required values: the
# chart's SpiceDB behind its gateway, and the broker's S3 bundle verified
# with a KMS key.
broker:
  authz:
    backend: spicedb
  bundle:
    source: s3://grant-bundles/cracha/prod
    kmsKey: arn:aws:kms:eu-west-1:111122223333:key/0123abcd-0123-0123-0123-0123456789ab
spicedb:
  replicas: 1
  presharedKeySecret:
    name: spicedb-key
  gateway:
    trustDomain: example.org
access:
  enabled: true
