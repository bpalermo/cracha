# The static backend with its assignments from the publication the bundle
# comes from: no assignments ConfigMap, nothing mounted for them, and the
# verification keys as a list, the old and the new of a rotation.
broker:
  assignments:
    source: published
  bundle:
    source: s3://grant-bundles/prod
    verifyKey:
      - |
        -----BEGIN PUBLIC KEY-----
        MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAE1111111111111111111111111111
        1111111111111111111111111111111111111111111111111111111111111111
        -----END PUBLIC KEY-----
      - |
        -----BEGIN PUBLIC KEY-----
        MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAE2222222222222222222222222222
        2222222222222222222222222222222222222222222222222222222222222222
        -----END PUBLIC KEY-----
