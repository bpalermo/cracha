# Overrides the name used for the chart's resources (default: the chart name).
# The Services are <name>-broker and <name>-webhook, the DaemonSet <name>-agent.
nameOverride: ""

# Pull secrets added to every pod of the chart.
imagePullSecrets: []

# Every image of the chart is set the same way:
#
#   repository  Substituted at package time from the component's image_push
#               target, which takes it from bazel/registry.bzl: the registry
#               is spelled out in one place.
#   tag         Defaults to the chart's appVersion. Ignored when digest is set.
#   digest      Substituted at package time with the digest of the image index
#               the push target publishes, so a published chart can only
#               reference the images built from the same commit. Takes
#               precedence over tag. A chart you build yourself pins the image
#               YOUR build produces, which exists nowhere until it is pushed:
#               install it with `--set <component>.image.digest=` (empty) to
#               use `tag` instead, as e2e/run.sh does.

# The credential broker (design 6): verifies a pod's JWT-SVID, looks its
# grants up and answers with STS credentials in the container-credentials
# format the AWS SDKs read.
broker:
  image:
    repository: "{@//broker:image_push.repository}"
    tag: ""
    digest: "{@//broker:image_push.digest}"
    pullPolicy: IfNotPresent

  # Stateless; the design runs at least three. A PodDisruptionBudget keeping
  # all but one up is created when there is more than one.
  replicas: 3

  # The API port, in the pod and on the Service: SPIFFE mTLS, served with
  # the broker's own X.509-SVID from the Workload API below. The only client
  # it admits is the node agent, by SPIFFE ID (design 6.5).
  port: 8443

  # The plaintext port the kubelet's probes are answered on (/healthz and
  # /readyz, nothing else): the kubelet cannot present an SVID. Not on the
  # Service.
  healthPort: 8081

  # The SPIFFE ID of the node agent, the one client the broker accepts.
  # Empty derives it from the broker's own SVID and namespace:
  # spiffe://<trust domain>/ns/<release namespace>/sa/cracha-agent, which is
  # the agent's identity under the issuer's default entries (design 4.2).
  # Set it when the agent runs as another service account or namespace, or
  # when the release name is overridden, which renames its service account.
  agentSpiffeID: ""

  # The name of the cluster this broker serves, as it appears in the
  # SourceIdentity of every session it assumes (design 4.3). Required.
  cluster: ""

  # Short labels for trust domains, which keep SourceIdentity within its 64
  # characters: <trust domain>: <label>. An unmapped domain is encoded as
  # td.<name>.
  #   trustDomainLabels:
  #     prod.example.org: prod
  trustDomainLabels: {}

  # The AWS region STS is called in. Empty leaves it to the SDK's default
  # chain (AWS_REGION in env, below).
  awsRegion: ""

  # The log level: debug, info, warn or error.
  logLevel: info

  # The credential cache (design 6.7), between the authorization check and
  # STS: every request is still authorized, a session is reused while it
  # has at least minRemaining left, refreshed in the background after
  # refreshAt of its usable lifetime (lifetime less minRemaining), and
  # served for up to staleCheckMax after its last successful authorization
  # check when the store is unavailable. enabled false keeps every request
  # on the direct path, for debugging.
  cache:
    enabled: true
    minRemaining: 20m
    refreshAt: 0.7
    maxEntries: 10000
    staleCheckMax: 10m

  # The SPIFFE Workload API the broker gets its own X.509-SVID and the trust
  # bundles from (design 6.5): the volume holding the socket and the socket's file name in it.
  # `type` chooses the volume's source, and only that source is rendered:
  #   hostPath  a SPIRE agent sharing its socket directory on the node, the
  #             directory under `hostPath` (the default);
  #   csi       the SPIFFE CSI driver, with the driver named under `csi`.
  # The other source's map is ignored, so switching is `type` alone:
  #   workloadAPI:
  #     volume:
  #       type: csi
  workloadAPI:
    volume:
      type: hostPath
      hostPath:
        path: /run/spire/agent-sockets
        type: Directory
      csi:
        driver: csi.spiffe.io
        readOnly: true
    socket: spire-agent.sock

  # The authorization backend (design 6.3): which workloads hold which
  # grants, and their service and team tags.
  #   static   the assignments of `assignments` below, held in memory: a
  #            document of this install's, or the published ones.
  #   spicedb  the reference backend (design 6.4; broker/internal/authz/
  #            spicedb), reached through SpiceDB's gateway over SPIFFE mTLS
  #            with the broker's own X.509-SVID; the broker holds no key and
  #            the gateway admits it to the read methods only. The chart
  #            deploys SpiceDB and the gateway (`spicedb` below) unless
  #            spicedb.enabled is false. The knobs under `spicedb`:
  #     endpoint        host:port of the gateway; empty for the chart's own,
  #                     <name>-spicedb.<namespace>.svc:<spicedb.gateway.port>.
  #     serverSpiffeID  the SPIFFE ID the gateway must present: a full ID, or
  #                     empty for /ns/<namespace>/sa/<name>-spicedb in the
  #                     broker's own trust domain, the chart's gateway.
  #     timeout         how long one SpiceDB call may take.
  authz:
    backend: static
    spicedb:
      endpoint: ""
      serverSpiffeID: ""
      timeout: 5s

  # The static backend's assignments (broker/internal/authz/static), used
  # with `authz.backend` static: which workloads belong to which service,
  # and the grants of each service and workload. `source` says where they
  # come from:
  #   file       (the default) the document below, which the chart puts in a
  #              ConfigMap, or the name of a ConfigMap you keep yourself;
  #              `key` is the file in it. Read once: a new document restarts
  #              the broker. For development and single-cluster installs.
  #   published  the assignments `grantc compile` writes beside the bundle
  #              from the Service and Assignment documents of the same
  #              source tree, signed and published with it: every cluster
  #              whose broker reads the same `bundle.source` holds the same
  #              assignments, a new version takes effect at the next poll
  #              without a restart, and a version is put in service only
  #              when both its bundle and its assignments verify. Needs
  #              `bundle.source`; the document and the ConfigMap are unused.
  # The subjects are the identity encoding of design 4.3:
  # <trust domain label>/<namespace>/<service account>.
  #   document:
  #     services:
  #       - name: payments
  #         team: payments
  #         members:
  #           - prod/payments/ledger
  #         grants:
  #           - name: payments-ledger-rw
  assignments:
    source: file
    existingConfigMap: ""
    key: assignments.yaml
    document:
      services: []

  # The compiled grant bundle (design 6.2; common/grant, grantc), the
  # production source of grants: the broker polls it, verifies its signature
  # over the published bytes, swaps it in atomically and keeps the last good
  # one on any failure. Until a bundle has verified the broker is not ready.
  # With `source` empty the broker reads the fixture in `grants` instead.
  #   source        local:<dir>, a directory in the pod with the layout
  #                 `grantc publish` writes (latest, bundles/<version>/
  #                 bundle.json and .sig, and with `assignments.source`
  #                 published assignments.json and .sig), mounted there from
  #                 `volume`; or s3://bucket[/prefix], read with the
  #                 broker's own AWS credentials (s3:GetObject on the
  #                 prefix).
  #   verifyKey     the PEM public key of the signing key (the one
  #                 `grantc verify -pub` takes), which the chart keeps in a
  #                 Secret; or several, as one string of PEM blocks or a
  #                 list of them, any of which verifies (the one a signature
  #                 names), to rotate the signing key: trust the new key
  #                 beside the old, sign with the new, then drop the old; or
  #   existingSecret  a Secret you keep, with the PEM, of one or more keys,
  #                 under `public.pem`; or
  #   kmsKey        the ARN or alias of the KMS signing key, whose public
  #                 key the broker fetches once (kms:GetPublicKey, the only
  #                 KMS permission it needs) and verifies with locally.
  #                 Prefer verifyKey with the key's exported PEM
  #                 (`aws kms get-public-key`): no AWS call at all.
  #                 Exactly one of the three.
  #   pollInterval  how often the broker looks for a new version.
  #   volume        for a local source, the Kubernetes volume source mounted
  #                 at the directory `source` names, such as a ConfigMap
  #                 whose items lay the files out:
  #                   configMap:
  #                     name: grant-bundle
  #                     items:
  #                       - {key: latest, path: latest}
  #                       - {key: bundle.json, path: bundles/<version>/bundle.json}
  #                       - {key: bundle.json.sig, path: bundles/<version>/bundle.json.sig}
  #                       - {key: assignments.json, path: bundles/<version>/assignments.json}
  #                       - {key: assignments.json.sig, path: bundles/<version>/assignments.json.sig}
  bundle:
    source: ""
    verifyKey: ""
    existingSecret: ""
    kmsKey: ""
    pollInterval: 60s
    volume: {}

  # The resolved-grants fixture (broker/internal/grants/fixture.go), for
  # development, the same way as the assignments: the document or an
  # existing ConfigMap. Used only while `bundle.source` is empty; a broker
  # with no grants denies every request.
  #   document:
  #     version: "2026-01-01"
  #     grants:
  #       - name: payments-ledger-rw
  #         account: "111122223333"
  #         baseRole: arn:aws:iam::111122223333:role/broker/shape-dynamo-rw
  #         sessionPolicy: {...}
  #         sessionTags: {team: payments}
  #         durationSeconds: 3600
  #         envelope:
  #           - arn:aws:dynamodb:*:111122223333:table/payments-*
  grants:
    existingConfigMap: ""
    key: grants.yaml
    document:
      version: none
      grants: []

  # The broker's own AWS credentials come from the platform (design 5): EKS
  # Pod Identity or an instance profile needs nothing here; IAM roles for
  # service accounts need the role on the service account:
  #   serviceAccount:
  #     annotations:
  #       eks.amazonaws.com/role-arn: arn:aws:iam::111122223333:role/cracha-broker
  serviceAccount:
    annotations: {}

  # Extra environment for the broker's container, as a container's `env` and
  # `envFrom`: an STS endpoint (AWS_ENDPOINT_URL_STS), static credentials
  # from a Secret for a cluster without a platform identity, a proxy.
  env: []
  envFrom: []

  priorityClassName: ""
  nodeSelector: {}
  tolerations: []
  # Requests, so the broker is never BestEffort: a starved probe on a busy
  # node restarts it. Measured idle use is a few millicores and ~10Mi;
  # memory grows with the credential cache holds up to cache.maxEntries sessions. No CPU limit: CFS throttling stalls short
  # bursts (startup, a refresh wave) for no benefit.
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi
  podAnnotations: {}

# The node agent (design 7), one pod per node, in the host network: binds a
# loopback listener inside each enrolled pod's network namespace before the
# pod's app containers start, and serves the AWS SDK's credential requests
# on it with what the broker issued for that pod's identity. Nothing in the
# pod is trusted, mounted or protected.
agent:
  image:
    repository: "{@//agent:image_push.repository}"
    tag: ""
    digest: "{@//agent:image_push.digest}"
    pullPolicy: IfNotPresent

  # The port of the loopback listener, the same in every pod; the webhook
  # writes it into AWS_CONTAINER_CREDENTIALS_FULL_URI (design 7.1).
  port: 9797

  # How a new pod's listener is bound before its app containers start
  # (design 7.2):
  #   init  the webhook injects an init container, cracha-enrol, which calls
  #         the agent's enrolment endpoint on the node's address with the
  #         pod's bound ServiceAccount token. Needs nothing of the node but
  #         the agent.
  #   cni   a chained CNI plugin, cracha-cni, tells the agent over its Unix
  #         socket on every sandbox's ADD and DEL. Nothing enters the pod
  #         spec but the env and the label; the node's CNI configuration
  #         is changed instead: an init container of the DaemonSet,
  #         cni-install, copies the plugin from the agent image into
  #         cni.binDir and chains it after the node's primary plugin in
  #         the lexically first conflist of cni.confDir, the one the
  #         runtime uses (kind: 10-kindnet.conflist). From then on every
  #         new pod of the node, enrolled or not, waits for the agent
  #         when it is down (design 7.2).
  enrol: init

  # With enrol init: the port of the enrolment endpoint on every node's
  # address, and how long the init container keeps trying before it exits
  # non-zero and kubelet restarts it (fail closed). The webhook reads the
  # timeout when it injects the init container; the agent does not.
  enrolPort: 9798
  enrolTimeout: 2m

  # With enrol init: the init container's resources, its requests and its
  # limits alike (a Guaranteed pod stays Guaranteed). The CPU is what keeps
  # a process that lives for a second out of CFS throttling: at 10m runc's
  # init and the enrol binary were throttled into holding a pod in Init for
  # close to 30 seconds; 100m is the smallest value measured not to (kind:
  # 10m 28 s, 100m 2.7 s, 250m 1.5 s, 500m 1.2 s from pod creation to the
  # container's exit). The request also counts for the pod's scheduling
  # while it initialises.
  enrolResources:
    cpu: 100m
    memory: 32Mi

  # With enrol cni: the agent's Unix socket, in a host directory it owns
  # (created 0700, the socket 0600, so only the node's root, which execs the
  # plugin, reaches it), and the node's CNI bin and conf directories the
  # installer writes to: the only host paths the agent image ever writes,
  # in the cni-install init container and in the agent container's
  # cni-retire preStop hook, which takes the plugin off the node again
  # when the agent is not coming back in cni mode (the chart uninstalled,
  # or enrol switched to init; a restart, a rollout or a drain leaves it).
  # The entry it chains is
  # {"type": "cracha-cni", "socket": <cni.socket>, "timeout": "5s"}.
  cni:
    socket: /run/cracha/cni.sock
    binDir: /opt/cni/bin
    confDir: /etc/cni/net.d

  # How long one credential request retries a pod the issuer does not know
  # yet (its entry on its way to the node's issuer agent) or an issuer that
  # is unavailable, before answering 503 for the SDK to retry (design 7.3).
  # Keep it under the SDKs' request timeouts.
  fetchDeadline: 3s

  # Prewarm (design 7.2): when a pod's listener is bound (at enrolment, in
  # either mode, and when the agent re-binds it on start), the agent runs
  # the pod's first request in the background: it fetches the pod's
  # JWT-SVID, retrying for up to 30 s while the issuer learns of the new
  # pod, and calls the broker once, discarding the answer. The broker then
  # holds the pod's session in its cache (design 6.7) and the app's first
  # request is a cache hit instead of an STS call; enrolment never waits
  # for it, and a failure is only logged. The agent keeps no credentials
  # either way. false leaves the first request to do it all.
  prewarm: true

  # The broker (design 7.3): its URL, empty for the broker Service of this
  # release, https://<name>-broker.<namespace>.svc:<broker.port>; the
  # SPIFFE ID it must present, verified instead of any DNS name or CA: a
  # full ID, or empty for /ns/<namespace>/sa/<name>-broker in the agent's
  # own trust domain; and how long one call may take.
  brokerUrl: ""
  brokerSpiffeID: ""
  brokerTimeout: 10s

  # The container runtime's CRI socket, through which a pod's network
  # namespace is resolved (design 7.2, init mode, and 7.4); mounted
  # read-only. /run/containerd/containerd.sock for containerd,
  # /var/run/crio/crio.sock for CRI-O.
  criSocket: /run/containerd/containerd.sock

  # The directory the runtime keeps the sandboxes' network namespaces in,
  # which the paths it reports are under; mounted read-only, at the same
  # path, following the host's mounts. /var/run/netns for containerd and
  # CRI-O.
  netnsDir: /var/run/netns

  # The identity issuer's two sockets on each node, from a SPIRE agent
  # (design 4.2): the Workload API, for the agent's own identity, and the
  # Broker API, which hands out the pods' JWT-SVIDs. Each is a host
  # directory and the socket's file name in it; both are mounted read-only.
  workloadAPI:
    hostPath: /run/spire/agent-sockets
    socket: spire-agent.sock
  brokerAPI:
    hostPath: /run/spire/broker-sockets
    socket: broker.sock
    # The group that owns the Broker API socket, given to the agent as a
    # supplementary group. The agent runs as root with every capability
    # dropped but SYS_ADMIN, so it cannot open a socket of another user
    # without being in its group. The SPIRE chart creates the socket mode
    # 0770, owned by the spire-agent's uid and gid (1000 with its
    # recommended securityContext): set 1000 there. Empty when the issuer's
    # agent runs as root.
    group: ""

  # The port of the agent's /healthz and /readyz, on the node's address.
  healthzPort: 9799

  # The log level: debug, info, warn or error.
  logLevel: info

  priorityClassName: system-node-critical

  # The agent must run on every node where the identity issuer's agent runs
  # and enrolled pods can be scheduled, and nowhere else: on a node without
  # the issuer's sockets its hostPath mounts fail and the DaemonSet never
  # becomes ready. Mirror the issuer agent's tolerations here (for SPIRE,
  # the spire-agent DaemonSet's). The default tolerates no taint, so
  # tainted nodes (a control plane) are left out.
  tolerations: []

  nodeSelector: {}
  # Requests, so the agent is never BestEffort: a starved probe on a busy
  # node restarts it. Measured idle use is a few millicores and ~10Mi;
  # memory grows with one listener and one cached JWT-SVID per enrolled pod of the node. No CPU limit: CFS throttling stalls short
  # bursts (startup, a refresh wave) for no benefit.
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      memory: 128Mi
  podAnnotations: {}

# The mutating webhook (design 7.5): for pods whose ServiceAccount opts in,
# the loopback credentials endpoint in every container's environment, the
# enrolment label and, with agent.enrol init, the enrolment init container.
# It serves its X.509-SVID from the Workload API and keeps the caBundle of
# its own webhook configuration at its trust bundle, so nothing but the
# identity issuer signs anything here: the issuer must give the webhook's
# service account an entry whose X.509-SVID carries the DNS SAN
# <name>-webhook.<namespace>.svc (design 4.2; SPIRE: a ClusterSPIFFEID with
# dnsNameTemplates).
webhook:
  image:
    repository: "{@//webhook:image_push.repository}"
    tag: ""
    digest: "{@//webhook:image_push.digest}"
    pullPolicy: IfNotPresent

  # With failurePolicy Fail, an unreachable webhook refuses every pod of the
  # namespaces it covers: run more than one. A PodDisruptionBudget keeping
  # all but one up is created when there is more than one.
  replicas: 2

  # The HTTPS port in the pod; the Service listens on 443.
  port: 8443

  # The SPIFFE Workload API the webhook's X.509-SVID and trust bundle come
  # from, shaped as the broker's: the volume holding the socket, chosen by
  # `type` among the sources beside it, and the socket's file name in it.
  workloadAPI:
    volume:
      type: hostPath
      hostPath:
        path: /run/spire/agent-sockets
        type: Directory
      csi:
        driver: csi.spiffe.io
        readOnly: true
    socket: spire-agent.sock

  # AWS_REGION for the pods that do not set their own. Required.
  defaultRegion: ""

  # What to do with AWS credential variables a pod sets itself: "reject" the
  # pod, or "strip" them and record what was removed in an annotation.
  conflictingEnv: reject

  # The SDK's patience with the credential endpoint (design 7.7), injected
  # into every wired container that does not set its own as
  # AWS_METADATA_SERVICE_TIMEOUT (whole seconds, per attempt) and
  # AWS_METADATA_SERVICE_NUM_ATTEMPTS. Of the first-party SDKs only PHP
  # reads them for the container provider (as a timeout and a retry
  # count); the others read them for IMDS only, or not at all, and keep
  # their own defaults, which is what agent.prewarm is for. Five seconds
  # outlasts agent.fetchDeadline (3s), so a pod the issuer does not know
  # yet gets the agent's 503 rather than a timeout, and three attempts
  # outlast the fetch deadline and agent.brokerTimeout (10s) together.
  # 0 leaves the variable out.
  sdkTimeouts:
    timeoutSeconds: 5
    attempts: 3

  # How long a ServiceAccount lookup is remembered; 0 looks up every pod.
  saCacheTTL: 30s

  # How long the apiserver waits for an answer before failing the pod.
  timeoutSeconds: 10

  # Stopping (design 7.5). Told to stop, a webhook pod reports not ready at
  # once, keeps answering for `drain` while the apiserver stops sending to
  # it, then shuts down, waiting up to `shutdownTimeout` for the admissions
  # in flight; the pod's termination grace period is the two plus a margin.
  # A rollout brings a new pod up and keeps it Ready for `minReadySeconds`
  # before the old one is told to stop, so no admission is lost to a
  # pod that is gone. Durations are whole seconds (5s, 1m).
  drain: 5s
  shutdownTimeout: 10s
  minReadySeconds: 5

  # Namespaces the webhook never sees, besides the release's own namespace,
  # which is always excluded: a pod of the webhook's own namespace must not
  # depend on the webhook to start, and the identity issuer's agent, which
  # the webhook's certificate comes from, must start without the webhook
  # (design 7.5). The default is SPIRE's usual namespaces and kube-system;
  # a list given here replaces it, so repeat what still applies.
  excludedNamespaces:
    - spire-system
    - spire-server
    - spire-mgmt
    - kube-system

  # Labels a namespace must carry for the webhook to see its pods, on top of
  # the exclusions above. Empty, the default, means every namespace that is
  # not excluded. The webhook's failurePolicy is Fail, so while it is
  # unreachable (its start, an outage) it refuses every pod of the
  # namespaces it covers, wired or not; on a cluster shared with other
  # workloads, name the namespaces that use Crachá by a label instead, for
  # example
  #   namespaceLabels:
  #     cracha.dev/enabled: "true"
  namespaceLabels: {}

  # Labels a pod may carry to be seen by the webhook whatever its namespace
  # (outside the exclusions above), for a workload that opts in on its own:
  #   podLabels:
  #     cracha.dev/enabled: "true"
  # With namespaceLabels or podLabels set, the webhook sees a pod when its
  # namespace carries the namespace labels OR the pod carries the pod
  # labels; with neither, every pod. Do not use cracha.dev/credentials: the
  # webhook sets that label itself and leaves a pod that has it unchanged.
  podLabels: {}

  # The log level: debug, info, warn or error.
  logLevel: info

  priorityClassName: ""
  nodeSelector: {}
  tolerations: []
  # Requests, so the webhook is never BestEffort: a starved probe on a busy
  # node restarts it. Measured idle use is a few millicores and ~10Mi;
  # memory grows with a ServiceAccount and Namespace cache. No CPU limit: CFS throttling stalls short
  # bursts (startup, a refresh wave) for no benefit.
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      memory: 128Mi
  podAnnotations: {}

# SpiceDB, the store of the spicedb authorization backend (design 6.4),
# rendered when broker.authz.backend is spicedb and `enabled` is true. Each
# pod runs two containers: SpiceDB, listening in plaintext on the pod's
# loopback only, with its preshared key from a Secret only this pod mounts;
# and the gateway, an Envoy sidecar, the only thing reachable from outside
# the pod. The gateway serves SPIFFE mTLS on `gateway.port` with the pod's
# X.509-SVID from the SPIRE agent's SDS (the Workload API socket), admits
# exactly the identities and gRPC methods of the table below (any other
# call, or any other SPIFFE ID, is answered PERMISSION_DENIED; a client
# without a certificate fails the handshake), and forwards to SpiceDB with
# `authorization: Bearer <preshared key>`. The gateway is a sidecar rather
# than a Deployment of its own so that nothing depends on a NetworkPolicy
# being enforced: SpiceDB's port is not on the pod's network at all.
#
#   client      SPIFFE ID (default)                       methods
#   broker      /ns/<namespace>/sa/<name>-broker      PermissionsService/CheckPermission,
#                                                     /LookupResources, /ReadRelationships;
#                                                     WatchService/Watch
#   access      /ns/<namespace>/sa/<name>-access      the broker's, and PermissionsService/
#                                                     WriteRelationships, /DeleteRelationships
#   reconciler  /ns/<namespace>/sa/<name>-reconciler  SchemaService/WriteSchema, /ReadSchema
spicedb:
  enabled: true

  # SpiceDB with a shared datastore is stateless; two replicas by default.
  # The memory engine needs exactly one. A PodDisruptionBudget keeping all
  # but one up is created when there is more than one.
  replicas: 2

  # Crachá's SpiceDB (//bazel/spicedb): upstream's release plus one patch,
  # the SPIFFE workload identity of `datastore.spiffe`, with
  # grpc_health_probe beside it as in upstream's image. Pinned at package
  # time like the chart's own images.
  image:
    repository: "{@//bazel/spicedb:image_push.repository}"
    tag: ""
    digest: "{@//bazel/spicedb:image_push.digest}"
    pullPolicy: IfNotPresent

  # The port SpiceDB serves gRPC on, on the pod's loopback (127.0.0.1)
  # only; the gateway forwards to it. Not on the pod's network.
  port: 50052

  # SpiceDB's preshared key: a Secret you keep, mounted by this pod alone
  # (SpiceDB reads it, the gateway adds it to every call it forwards). No
  # client of SpiceDB holds it. One line with no trailing newline, since it
  # travels as a header value (`openssl rand -hex 32 | tr -d '\n'`).
  # Required.
  presharedKeySecret:
    name: ""
    key: preshared-key

  # The datastore every replica shares:
  #   engine            memory (development and kind: one replica, nothing
  #                     survives a restart), mysql or postgres.
  #   uriSecret         with mysql or postgres, a Secret you keep holding the
  #                     connection URI under `key` (SpiceDB's
  #                     --datastore-conn-uri), for the SpiceDB pods and the
  #                     migration Job.
  #   caSecret          optional: a Secret with the PEM of the authority the
  #                     datastore server's certificate chains to, under
  #                     `key`, mounted and named by SSL_CERT_FILE, so a URI
  #                     with tls=true (mysql) or sslmode=verify-full
  #                     (postgres) verifies a private root. It replaces the
  #                     system roots in SpiceDB's containers, which make no
  #                     other TLS connection (telemetry is off).
  #   clientCertSecret  optional, postgres only: a Secret with a client
  #                     certificate and key (`certKey`, `keyKey`) mounted at
  #                     /etc/spicedb/datastore-client, for a URI that logs in
  #                     by certificate:
  #                       postgres://spicedb@db:5432/spicedb?sslmode=verify-full&sslrootcert=/etc/spicedb/datastore-ca/ca.pem&sslcert=/etc/spicedb/datastore-client/tls.crt&sslkey=/etc/spicedb/datastore-client/tls.key
  #                     The chart does not rotate it: a new certificate in
  #                     the Secret reaches the pods as the kubelet updates
  #                     the volume.
  #   spiffe            mysql only: SpiceDB logs in with its X.509-SVID from
  #                     the SPIFFE Workload API (`workloadAPI` below, mounted
  #                     into SpiceDB's container and the migration Job) and
  #                     verifies the server against the Workload API's bundle
  #                     of the server's trust domain, by SPIFFE ID: no
  #                     password, no CA Secret, nothing on disk, rotation
  #                     without a restart. The MySQL user is `REQUIRE
  #                     SUBJECT` the SVID's subject, which the issuer's entry
  #                     sets (SPIRE: its first DNS name becomes the CN). The
  #                     pods of both carry the label
  #                     cracha.dev/datastore-client: "true" for that entry to
  #                     select them. The URI's tls= must be empty or true.
  #                       enabled    turns it on
  #                       serverID   required: the SPIFFE ID the server
  #                                  presents, or a trust domain
  #                                  (spiffe://example.org) for any of its
  #                                  workloads; a federated one needs the
  #                                  issuer's entry to federate with it
  #                       id         the SVID SpiceDB presents, and no other
  #                                  (empty: spiffe://<gateway.trustDomain>
  #                                  /ns/<namespace>/sa/<name>-spicedb)
  #                       migrationID the migration Job's (empty: the same
  #                                  path with its ServiceAccount,
  #                                  <name>-spicedb-migrate)
  datastore:
    engine: memory
    uriSecret:
      name: ""
      key: uri
    caSecret:
      name: ""
      key: ca.pem
    clientCertSecret:
      name: ""
      certKey: tls.crt
      keyKey: tls.key
    spiffe:
      enabled: false
      serverID: ""
      id: ""
      migrationID: ""

  # The migration Job, the one owner of the datastore's schema migrations
  # (SpiceDB's serve never migrates): `spicedb migrate head`, a Helm
  # pre-install and pre-upgrade hook, so an upgrade migrates before the new
  # pods start. Not rendered for the memory engine, which has nothing to
  # migrate. With a datastore several clusters share, enable it on one
  # cluster only, and upgrade that one first: every cluster runs the same
  # SpiceDB version.
  migration:
    enabled: true
    timeout: 1h
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi

  # SpiceDB's log level: trace, debug, info, warn or error.
  logLevel: info

  # The gateway (Envoy), the pod's one listener.
  gateway:
    # The official distroless Envoy image, pinned by tag and by the index
    # digest, which `docker buildx imagetools inspect
    # envoyproxy/envoy:distroless-v1.39.4` reported.
    image:
      repository: docker.io/envoyproxy/envoy
      tag: distroless-v1.39.4
      digest: sha256:ccb37e93d8274a525fe00d67287716dbe3d58bc4237d7627af9e64fae0fd25c8
      pullPolicy: IfNotPresent

    # The SPIFFE mTLS port, in the pod and on the Service <name>-spicedb.
    port: 50051

    # The plaintext port the kubelet's probes are answered on: /ready (the
    # gateway is serving and SpiceDB answers its health checks) and /live.
    # Nothing else is served on it, and Envoy's admin interface stays on
    # the pod's loopback (127.0.0.1:9901).
    healthPort: 8080

    # The trust domain of the gateway's clients, for the default SPIFFE IDs
    # of the table above. Required with the chart's SpiceDB.
    trustDomain: ""

    # The SPIFFE IDs the gateway admits, each to its methods; empty for the
    # default of the table above. A full ID: spiffe://<td>/<path>.
    identities:
      broker: ""
      access: ""
      reconciler: ""

    # The Envoy log level: trace, debug, info, warning, error or critical.
    logLevel: info

    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        memory: 128Mi

  # The SPIFFE Workload API the gateway's X.509-SVID and trust bundle come
  # from (as SDS: the SPIRE agent serves Envoy's SDS on the Workload API
  # socket, the SVID as "default" and the trust domain's bundle as
  # "ROOTCA"), shaped as the broker's.
  workloadAPI:
    volume:
      type: hostPath
      hostPath:
        path: /run/spire/agent-sockets
        type: Directory
      csi:
        driver: csi.spiffe.io
        readOnly: true
    socket: spire-agent.sock

  # A NetworkPolicy admitting traffic to the pods' gateway and health ports
  # only (from `from`, a list of NetworkPolicyPeers; empty admits every
  # source) and none to anything else. Off by default: the design does not
  # rely on it, since SpiceDB is not on the pod's network, but where a CNI
  # enforces it it narrows who can reach the gateway's handshake.
  networkPolicy:
    enabled: false
    from: []

  priorityClassName: ""
  nodeSelector: {}
  tolerations: []
  # SpiceDB's own resources. Its memory grows with the caches it keeps;
  # with the memory engine, with every relationship too.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 1Gi
  podAnnotations: {}

# cracha-access (design 6.9): the only writer of the authorization
# relationships of an install whose broker uses the spicedb backend. Every
# write (a workload's or a service's relation to a resource, a service's
# membership) is authorized in SpiceDB, checked against the signed bundle
# the broker reads (broker.bundle, the same source and keys) the way CI
# checks a grant tree, put up for approval when its target is sensitive,
# and logged as a JSON line on stdout. Callers are SPIFFE IDs of the trust
# domain over mTLS; the CLI (`cracha-access grant|revoke|approve|reject|
# list|explain|pending`) calls it with the caller's SVID. One replica:
# writes are serialized in the process. Needs broker.authz.backend spicedb
# and broker.bundle.source.
access:
  enabled: false
  image:
    repository: "{@//access:image_push.repository}"
    tag: ""
    digest: "{@//access:image_push.digest}"
    pullPolicy: IfNotPresent

  # The gRPC port, in the pod and on the Service <name>-access: SPIFFE
  # mTLS with cracha-access's own X.509-SVID.
  port: 8443

  # The plaintext probe port (/healthz, /readyz: ready once the SVID is
  # there and a bundle has verified). Not on the Service.
  healthPort: 8081

  # SpiceDB, through the gateway that lets only cracha-access write
  # (design 6.4; its RBAC admits spicedb.gateway.identities.access, by
  # default .../sa/<name>-access): its address and SPIFFE ID (a full ID, or
  # a path in cracha-access's own trust domain), empty for the broker's
  # (broker.authz.spicedb), which default to the chart's SpiceDB:
  # <name>-spicedb on spicedb.gateway.port, /ns/<namespace>/sa/<name>-spicedb.
  spicedb:
    endpoint: ""
    serverSpiffeID: ""
    timeout: 10s

  # Approvals and expiry (design 6.9).
  #   pendingTTL     how long a write on a sensitive target waits for an
  #                  approver before it is dropped.
  #   breakGlassMax  the furthest a break-glass write's expiresAt may be;
  #                  break-glass applies a write on a sensitive target at
  #                  once, by a caller that manages it, logged at WARN.
  #   maxExpiry      per target kind (s3_bucket, dynamodb_table, service),
  #                  makes expiresAt required and caps it:
  #                    maxExpiry:
  #                      s3_bucket: 720h
  approval:
    pendingTTL: 72h
    breakGlassMax: 4h
    maxExpiry: {}

  # Run IAM Access Analyzer's ValidatePolicy and CheckNoNewAccess on every
  # composed policy a write changes (CI's steps 2 and 3), with the pod's
  # own AWS credentials (serviceAccount below): access-analyzer:ValidatePolicy
  # and access-analyzer:CheckNoNewAccess.
  accessAnalyzer: false

  # Log every relationship change SpiceDB's Watch reports, whoever made it;
  # a change not made by cracha-access is logged at WARN.
  watchAudit: true

  # The AWS region for S3, KMS and Access Analyzer; empty uses the SDK's
  # default chain.
  awsRegion: ""

  # The log level of the service's own log (stderr); the audit log is
  # stdout, always.
  logLevel: info

  # The SPIFFE Workload API cracha-access's X.509-SVID comes from, shaped
  # as the broker's.
  workloadAPI:
    volume:
      type: hostPath
      hostPath:
        path: /run/spire/agent-sockets
        type: Directory
      csi:
        driver: csi.spiffe.io
        readOnly: true
    socket: spire-agent.sock

  # The platform identity for an S3 bundle source, a KMS verify key and
  # Access Analyzer (an IAM role annotation, an EKS Pod Identity
  # association). It holds no Kubernetes permissions.
  serviceAccount:
    annotations: {}

  env: []
  envFrom: []
  priorityClassName: ""
  nodeSelector: {}
  tolerations: []
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 256Mi
  podAnnotations: {}
