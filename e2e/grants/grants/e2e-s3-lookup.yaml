# The suite's lookup grant (design 6.2, Level 3): the same template as
# e2e-s3-reader, its bucket left to the authorization store. The broker
# renders it at issuance once per bucket the Access documents relate the
# workload to, and checks each against the envelope. What the tests in
# e2e/resources_test.go expect of the AssumeRole call comes from here.
kind: Grant
metadata:
  name: e2e-s3-lookup
spec:
  account: "111122223333"
  baseRole: arn:aws:iam::111122223333:role/broker/shape-e2e
  sessionPolicy:
    template: s3-object-read
    params:
      bucket: { lookup: { kind: s3_bucket, permission: read } }
  sessionTags: { team: platform }
  duration: 3600
  envelope:
    - arn:aws:s3:::cracha-e2e-*
