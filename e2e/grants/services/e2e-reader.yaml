# The reader holds the suite's grant that names its bucket, and reads
# another bucket through its Access document (access/), which the
# account's implicit grant (accounts/e2e.yaml) is rendered with: nothing
# here names that grant.
kind: Service
metadata:
  name: e2e-reader
spec:
  team: platform
  members: [cracha/e2e/reader]
  grants:
    - name: e2e-s3-reader
