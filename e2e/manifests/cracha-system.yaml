# Crachá as the end-to-end suite deploys it: the CSI node plugin, the broker
# and the webhook in cracha-system, plus the STS stand-in the broker talks to.
# The images are the ones e2e/run.sh builds from this checkout and loads into
# the kind node; the TLS Secrets come from run.sh too (a self-signed CA).
apiVersion: v1
kind: Namespace
metadata:
  name: cracha-system
---
# docs/design.md, section 7.1, verbatim.
apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  name: csi.cracha.dev
spec:
  attachRequired: false
  podInfoOnMount: true
  volumeLifecycleModes: [Ephemeral]
  requiresRepublish: true
  tokenRequests:
    - audience: cracha-csi
      expirationSeconds: 600
---
# --- cracha-csi ---------------------------------------------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cracha-csi
  namespace: cracha-system
---
# The plugin's only use of the API: checking the bound service account token
# kubelet hands it against the pod it was given (section 7.3, step 2).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cracha-csi
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cracha-csi
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cracha-csi
subjects:
  - kind: ServiceAccount
    name: cracha-csi
    namespace: cracha-system
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: cracha-csi
  namespace: cracha-system
  labels:
    app.kubernetes.io/name: cracha-csi
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: cracha-csi
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cracha-csi
    spec:
      serviceAccountName: cracha-csi
      # Section 7.7: no host networking, no host PID namespace, no
      # capabilities. Its host access is the kubelet plugin directories and
      # the SPIRE agent's sockets.
      containers:
        - name: csi
          image: localhost/cracha-csi:e2e
          # Never pull an image loaded from this build: it must be that one.
          imagePullPolicy: Never
          args:
            - --endpoint=unix:///csi/csi.sock
            - --issuer-broker-socket=/run/spire/broker/broker.sock
            - --workload-api=unix:///spiffe-workload-api/spire-agent.sock
            - --log-level=debug
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: healthz
              containerPort: 9808
          livenessProbe:
            httpGet:
              path: /healthz
              port: healthz
            periodSeconds: 10
          securityContext:
            # Root: it writes into kubelet's pod directories. Nothing more.
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: plugin-dir
              mountPath: /csi
            # The target paths kubelet hands the plugin are under here, and
            # must be the same path inside the container as on the host.
            - name: pods-dir
              mountPath: /var/lib/kubelet/pods
            - name: spire-workload-api
              mountPath: /spiffe-workload-api
              readOnly: true
            - name: spire-broker-api
              mountPath: /run/spire/broker
              readOnly: true
        # Registers the plugin's socket with kubelet.
        - name: node-driver-registrar
          # v2.18.0, pinned by digest so the suite does not depend on a
          # moving tag.
          image: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.18.0@sha256:b7fefd08651f00ac4df1a196ed4c621c2451fbb899297fe9fad9e36c667af0c0
          args:
            - --csi-address=/csi/csi.sock
            - --kubelet-registration-path=/var/lib/kubelet/plugins/csi.cracha.dev/csi.sock
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: plugin-dir
              mountPath: /csi
            - name: registration-dir
              mountPath: /registration
      volumes:
        - name: plugin-dir
          hostPath:
            path: /var/lib/kubelet/plugins/csi.cracha.dev
            type: DirectoryOrCreate
        - name: registration-dir
          hostPath:
            path: /var/lib/kubelet/plugins_registry
            type: Directory
        - name: pods-dir
          hostPath:
            path: /var/lib/kubelet/pods
            type: Directory
        # The SPIRE agent's sockets (e2e/spire.yaml): the Workload API for
        # the plugin's own identity, the Broker API for the pods' tokens.
        - name: spire-workload-api
          hostPath:
            path: /run/spire/agent-sockets
            type: Directory
        - name: spire-broker-api
          hostPath:
            path: /run/spire/broker-sockets
            type: Directory
---
# --- cracha-broker ------------------------------------------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cracha-broker
  namespace: cracha-system
---
# The static authorization backend's file (broker/internal/authz/static).
# Subjects are the idenc authz encoding: <trust-domain label>/<ns>/<sa>, with
# the label the broker's --trust-domain-labels gives cracha.test. The e2e
# namespace's client holds one grant through its service; unassigned is not
# here at all.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cracha-assignments
  namespace: cracha-system
data:
  assignments.yaml: |
    services:
      - name: e2e-client
        team: platform
        members:
          - cracha/e2e/client
        grants:
          - name: e2e-s3-reader
---
# The resolved-grants fixture (broker/internal/grants/fixture.go): one grant
# on one shape role, with a session policy inside its envelope.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cracha-grants
  namespace: cracha-system
data:
  grants.yaml: |
    version: e2e-1
    grants:
      - name: e2e-s3-reader
        account: "111122223333"
        baseRole: arn:aws:iam::111122223333:role/broker/shape-e2e
        sessionPolicy:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action: [s3:GetObject]
              Resource: arn:aws:s3:::cracha-e2e-bucket/*
        sessionTags: {team: platform}
        durationSeconds: 3600
        envelope:
          - arn:aws:s3:::cracha-e2e-*
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cracha-broker
  namespace: cracha-system
  labels:
    app.kubernetes.io/name: cracha-broker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cracha-broker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cracha-broker
    spec:
      serviceAccountName: cracha-broker
      containers:
        - name: broker
          image: localhost/cracha-broker:e2e
          imagePullPolicy: Never
          args:
            - --listen=:8443
            - --tls-cert=/etc/cracha/tls/tls.crt
            - --tls-key=/etc/cracha/tls/tls.key
            - --workload-api-socket=unix:///spiffe-workload-api/spire-agent.sock
            - --cluster=kind
            - --trust-domain-labels=cracha.test=cracha
            - --assignments=/etc/cracha/assignments/assignments.yaml
            - --grants-fixture=/etc/cracha/grants/grants.yaml
            - --aws-region=us-east-1
            - --log-level=debug
          env:
            # The broker's own AWS credentials (section 5) are the
            # platform's; here, anything the stub accepts, which is anything.
            - name: AWS_ACCESS_KEY_ID
              value: cracha-e2e
            - name: AWS_SECRET_ACCESS_KEY
              value: cracha-e2e
            # The SDK's own endpoint override: STS is the stub below.
            - name: AWS_ENDPOINT_URL_STS
              value: http://cracha-stsstub.cracha-system.svc:8080
            - name: AWS_EC2_METADATA_DISABLED
              value: "true"
          ports:
            - name: https
              containerPort: 8443
          readinessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
            periodSeconds: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tls
              mountPath: /etc/cracha/tls
              readOnly: true
            - name: assignments
              mountPath: /etc/cracha/assignments
              readOnly: true
            - name: grants
              mountPath: /etc/cracha/grants
              readOnly: true
            - name: spire-workload-api
              mountPath: /spiffe-workload-api
              readOnly: true
      volumes:
        - name: tls
          secret:
            secretName: cracha-broker-tls
        - name: assignments
          configMap:
            name: cracha-assignments
        - name: grants
          configMap:
            name: cracha-grants
        # The trust bundle the JWT-SVIDs are verified against comes from the
        # broker's own Workload API connection (section 6.5).
        - name: spire-workload-api
          hostPath:
            path: /run/spire/agent-sockets
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: cracha-broker
  namespace: cracha-system
spec:
  selector:
    app.kubernetes.io/name: cracha-broker
  ports:
    - name: https
      port: 8443
      targetPort: https
---
# --- cracha-webhook -----------------------------------------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cracha-webhook
  namespace: cracha-system
---
# The webhook looks up the pod's ServiceAccount for the annotation.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cracha-webhook
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cracha-webhook
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cracha-webhook
subjects:
  - kind: ServiceAccount
    name: cracha-webhook
    namespace: cracha-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cracha-webhook
  namespace: cracha-system
  labels:
    app.kubernetes.io/name: cracha-webhook
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cracha-webhook
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cracha-webhook
    spec:
      serviceAccountName: cracha-webhook
      containers:
        - name: webhook
          image: localhost/cracha-webhook:e2e
          imagePullPolicy: Never
          args:
            - --listen=:8443
            - --tls-cert=/etc/cracha/tls/tls.crt
            - --tls-key=/etc/cracha/tls/tls.key
            - --broker-url=https://cracha-broker.cracha-system.svc:8443
            - --default-region=us-east-1
            - --log-level=debug
          ports:
            - name: https
              containerPort: 8443
          readinessProbe:
            httpGet:
              path: /readyz
              port: https
              scheme: HTTPS
            periodSeconds: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tls
              mountPath: /etc/cracha/tls
              readOnly: true
      volumes:
        - name: tls
          secret:
            secretName: cracha-webhook-tls
---
apiVersion: v1
kind: Service
metadata:
  name: cracha-webhook
  namespace: cracha-system
spec:
  selector:
    app.kubernetes.io/name: cracha-webhook
  ports:
    - name: https
      port: 443
      targetPort: https
---
# --- the STS stand-in ---------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cracha-stsstub
  namespace: cracha-system
  labels:
    app.kubernetes.io/name: cracha-stsstub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cracha-stsstub
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cracha-stsstub
    spec:
      containers:
        - name: stsstub
          image: localhost/cracha-e2e-stsstub:e2e
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: cracha-stsstub
  namespace: cracha-system
spec:
  selector:
    app.kubernetes.io/name: cracha-stsstub
  ports:
    - name: http
      port: 8080
      targetPort: http
