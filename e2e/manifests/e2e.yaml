# The namespace the suite runs its workloads in, with the two identities
# e2e/spire.sh registers: client, which holds a grant (the assignments
# document in e2e/values.yaml), and unassigned, which holds none. Both
# opt in to the webhook. The namespace's default ServiceAccount does not,
# and its pods are left as they are.
apiVersion: v1
kind: Namespace
metadata:
  name: e2e
  labels:
    # The webhook covers only namespaces that opt in (e2e/values.yaml).
    cracha.dev/enabled: "true"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: client
  namespace: e2e
  annotations:
    cracha.dev/enabled: "true"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: unassigned
  namespace: e2e
  annotations:
    cracha.dev/enabled: "true"
