# SpiceDB, the reference authorization backend (docs/design.md, section
# 6.4), as the suite runs it in spicedb mode (E2E_AUTHZ=spicedb in
# e2e/run.sh): a fixture beside the chart, not part of the product. One
# replica on the memory datastore, which supports the Watch API the broker's
# cache flushes from and forgets everything on restart (run.sh writes the
# schema and the relationships after every rollout), plaintext gRPC on
# 50051 (TLS is not what this suite tests) and the preshared key from the
# Secret run.sh creates with a random value, the same Secret the chart hands
# the broker (e2e/values-spicedb.yaml).
#
# The image is the release authzed/spicedb publishes to ghcr.io, Docker Hub
# and quay.io under one index; pinned by tag and by the index digest, which
# `docker buildx imagetools inspect ghcr.io/authzed/spicedb:v1.56.2`
# reported (the same digest on all three registries).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cracha-spicedb
  namespace: cracha-system
  labels:
    app.kubernetes.io/name: cracha-spicedb
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cracha-spicedb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cracha-spicedb
    spec:
      containers:
        - name: spicedb
          image: ghcr.io/authzed/spicedb:v1.56.2@sha256:aa96009a0477f8a759149823407d47ad16d1a74390bae3102b3b0b7143502764
          args: [serve]
          env:
            - name: SPICEDB_DATASTORE_ENGINE
              value: memory
            - name: SPICEDB_GRPC_NO_TLS
              value: "true"
            - name: SPICEDB_GRPC_PRESHARED_KEY
              valueFrom:
                secretKeyRef:
                  name: cracha-e2e-spicedb
                  key: token
          ports:
            - name: grpc
              containerPort: 50051
          # SpiceDB serves grpc.health.v1 on its gRPC port.
          readinessProbe:
            grpc:
              port: 50051
            periodSeconds: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: cracha-spicedb
  namespace: cracha-system
spec:
  selector:
    app.kubernetes.io/name: cracha-spicedb
  ports:
    - name: grpc
      port: 50051
      targetPort: grpc
