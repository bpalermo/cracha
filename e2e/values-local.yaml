# The images e2e/run.sh just built from this checkout and loaded into the
# node: by tag, never pulled, with the digest the chart pins cleared (that
# digest exists in no registry until it is published).
broker:
  image: &local
    repository: localhost/cracha-broker
    tag: e2e
    digest: ""
    pullPolicy: Never
agent:
  image:
    <<: *local
    repository: localhost/cracha-agent
webhook:
  image:
    <<: *local
    repository: localhost/cracha-webhook
access:
  image:
    <<: *local
    repository: localhost/cracha-access
