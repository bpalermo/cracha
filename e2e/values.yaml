# How e2e/run.sh installs the chart in the kind cluster. The images are the
# chart's own: e2e/values-local.yaml replaces them with the ones built from
# this checkout. Every certificate is an X.509-SVID from the SPIRE of
# e2e/spire.yaml: the broker's, the agent's and the webhook's (whose entry
# carries its Service name, e2e/spire.sh), so there is no CA anywhere and
# the test workloads trust nothing.
broker:
  # One node, one replica.
  replicas: 1
  cluster: kind
  # The trust domain e2e/spire.sh registers everything under, with the label
  # the subjects of e2e/grants use.
  trustDomainLabels:
    cracha.test: cracha
  awsRegion: us-east-1
  logLevel: debug
  # The SPIRE agent's sockets (e2e/spire.yaml), shared on the node.
  workloadAPI:
    volume:
      type: hostPath
      hostPath:
        path: /run/spire/agent-sockets
        type: Directory
    socket: spire-agent.sock
  # The static backend's assignments (E2E_AUTHZ=static, the default; in
  # spicedb mode e2e/values-spicedb.yaml switches the backend): the ones
  # grantc compiled from the Services and Assignments of e2e/grants and
  # published with the bundle, as every cluster of a fleet would read them.
  # The e2e namespace's client holds one grant through its service, the
  # reader that grant and, through its Access document, the account's
  # implicit grant for the bucket it gives; unassigned is not there at all.
  assignments:
    source: published
  # The grants come the production way: a bundle run.sh compiles from
  # e2e/grants (one grant and the account's implicit grant, on the account
  # role, each with a session policy inside its envelope), signs with a key it generates and publishes, with the
  # assignments, into the ConfigMap cracha-e2e-bundle, mounted at this
  # directory. The volume (whose item paths carry the version) and the
  # public key are in the values file run.sh writes beside this one. The
  # poll is short, so a version a test republishes is in service within
  # seconds of the kubelet updating the mounted ConfigMap.
  bundle:
    source: local:/etc/cracha/bundle
    pollInterval: 2s
  env:
    # The broker's own AWS credentials (design 5) are the platform's; here,
    # anything the stub accepts, which is anything.
    - name: AWS_ACCESS_KEY_ID
      value: cracha-e2e
    - name: AWS_SECRET_ACCESS_KEY
      value: cracha-e2e
    # The SDK's own endpoint override: STS is the stand-in run.sh deploys
    # (e2e/manifests/stsstub.yaml).
    - name: AWS_ENDPOINT_URL_STS
      value: http://cracha-stsstub.cracha-system.svc:8080
    - name: AWS_EC2_METADATA_DISABLED
      value: "true"
agent:
  # The enrolment mode is the chart's default, init; E2E_ENROL=cni has
  # run.sh add e2e/values-cni.yaml on top.
  # The SPIRE agent's sockets (e2e/spire.yaml), shared on the node.
  workloadAPI:
    hostPath: /run/spire/agent-sockets
    socket: spire-agent.sock
  brokerAPI:
    hostPath: /run/spire/broker-sockets
    socket: broker.sock
    # The SPIRE agent runs as 1000:1000 (e2e/spire.yaml), as the SPIRE chart
    # recommends, so its 0770 socket is reachable through its group only.
    group: 1000
  # The kind node's containerd: its CRI socket, and the directory its CNI
  # bind-mounts the sandboxes' network namespaces into (cni-<id> files under
  # /var/run/netns, /var/run being /run on the node image).
  criSocket: /run/containerd/containerd.sock
  netnsDir: /var/run/netns
  logLevel: debug
webhook:
  replicas: 1
  defaultRegion: us-east-1
  logLevel: debug
  # SPIRE's pods are nobody's workloads.
  excludedNamespaces:
    - spire
  # Opt-in, as on a shared cluster: the webhook sees pods of namespaces
  # labelled cracha.dev/enabled (e2e/manifests/e2e.yaml labels the suite's)
  # and pods carrying that label anywhere else (TestWebhookOptIn).
  namespaceLabels:
    cracha.dev/enabled: "true"
  podLabels:
    cracha.dev/enabled: "true"
